<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" />
  <title>Catat cepat — Memoria</title>
  <link rel="icon" href="../logo.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #14161a; color: #e8eaef; font-size: 13px;
      padding: 14px;
    }
    .bar { display: flex; gap: 8px; margin-bottom: 10px; }
    select, input {
      background: #0d0e11; border: 1px solid #23262e; color: #e8eaef;
      border-radius: 7px; padding: 7px 9px; font-size: 12.5px; outline: none;
      font-family: inherit;
    }
    select:focus, input:focus { border-color: #6e8dff; }
    textarea {
      width: 100%; min-height: 96px; resize: vertical;
      background: #0d0e11; border: 1px solid #23262e; border-radius: 7px;
      color: #e8eaef; padding: 9px 10px; font-size: 13px; line-height: 1.5;
      outline: none; font-family: inherit;
    }
    textarea:focus { border-color: #6e8dff; }
    .foot { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
    .hint { font-size: 11px; color: #5c6472; }
    button {
      background: #6e8dff; border: none; color: #fff; border-radius: 7px;
      padding: 8px 16px; font-size: 12.5px; font-weight: 600; cursor: pointer;
      font-family: inherit;
    }
    button:hover { background: #7f9aff; }
    #status { font-size: 11.5px; min-height: 16px; }
    #status.ok { color: #4cc38a; }
    #status.err { color: #e5686b; }
  </style>
</head>
<body>
  <div class="bar">
    <select id="kind">
      <option value="fact">Fakta</option>
      <option value="decision">Keputusan</option>
      <option value="task_pending">Tugas pending</option>
      <option value="task_done">Tugas selesai</option>
      <option value="error_fixed">Error diperbaiki</option>
      <option value="preference">Preferensi</option>
      <option value="context">Konteks</option>
    </select>
    <input id="project" list="projects" placeholder="Proyek (opsional)" />
    <datalist id="projects"></datalist>
  </div>
  <textarea id="content" placeholder="Tulis memori cepat… (Ctrl+Enter untuk simpan)"></textarea>
  <div class="foot">
    <div id="status"></div>
    <div style="display:flex; gap:8px; align-items:center">
      <span class="hint">Esc untuk tutup</span>
      <button id="save">Simpan</button>
    </div>
  </div>
  <script src="quick.js"></script>
</body>
</html>
