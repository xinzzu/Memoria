<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'" />
  <title data-i18n="Search memories — Memoria">Search memories — Memoria</title>
  <link rel="icon" href="../logo.png" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: "Segoe UI", system-ui, sans-serif; background: #14161a; color: #e8eaef; font-size: 13px; }
    .search-box { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #23262e; }
    .search-box svg { width: 15px; height: 15px; color: #7b8396; flex-shrink: 0; }
    input {
      flex: 1; background: transparent; border: none; outline: none;
      color: #e8eaef; font-size: 15px; font-family: inherit;
    }
    input::placeholder { color: #5c6472; }
    #list { max-height: 430px; overflow-y: auto; }
    .item { padding: 10px 16px; cursor: pointer; border-left: 2px solid transparent; }
    .item.active { background: rgba(110, 141, 255, 0.12); border-left-color: #6e8dff; }
    .item .t { font-size: 12.5px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .item .meta { font-size: 10.5px; color: #6a7284; margin-top: 4px; }
    .item .meta b { color: #b3a6ff; font-weight: 600; }
    .empty { padding: 28px 16px; text-align: center; color: #5c6472; font-size: 12.5px; }
    .foot { padding: 8px 16px; border-top: 1px solid #23262e; font-size: 10.5px; color: #5c6472; display: flex; justify-content: space-between; }
    kbd { background: #0d0e11; border: 1px solid #2a2e38; border-radius: 4px; padding: 1px 5px; font-size: 10px; font-family: inherit; }
  </style>
</head>
<body>
  <div class="search-box">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="7" cy="7" r="4.5"/><path d="M11 11l3 3"/></svg>
    <input id="q" placeholder="Cari memori di semua tool…" autocomplete="off" />
  </div>
  <div id="list">
    <div class="empty">Ketik untuk mencari memori di semua tool AI.</div>
  </div>
  <div class="foot">
    <span><kbd>↑</kbd><kbd>↓</kbd> navigasi · <kbd>Enter</kbd> salin</span>
    <span><kbd>Esc</kbd> tutup</span>
  </div>
  <script src="i18n.js"></script>
<script src="palette.js"></script>
</body>
</html>
