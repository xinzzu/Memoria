name: Build Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: "*.exe"
          - os: ubuntu-latest
            artifact: "*.AppImage"
          - os: macos-latest
            artifact: "*.dmg"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - name: Build installer
        run: npx electron-builder --publish never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memoria-${{ matrix.os }}
          path: |
            dist-installer/*.exe
            dist-installer/*.AppImage
            dist-installer/*.deb
            dist-installer/*.dmg
            dist-installer/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog
        id: changelog
        run: |
          prev=$(git tag --sort=-version:refname | sed -n '2p')
          if [ -z "$prev" ]; then
            log=$(git log --pretty=format:"- %s (%h)" --no-merges "${GITHUB_REF_NAME}" --max-count=100)
          else
            log=$(git log --pretty=format:"- %s (%h)" --no-merges "$prev..${GITHUB_REF_NAME}")
          fi
          printf '## Changes since %s\n\n%s\n' "${prev:-the beginning}" "$log" > changelog.md
          echo "changelog prepared"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body_path: changelog.md
          files: dist/*
          generate_release_notes: false
