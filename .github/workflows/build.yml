name: Build Installers

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test + build
        run: npm test
      - name: UI audit
        run: npm run check:ui
      - name: Verify tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          expected="v${version}"
          if [ "${GITHUB_REF_NAME}" != "${expected}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} tidak cocok dengan package.json (${expected}). Bump versi dulu."
            exit 1
          fi

  build:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build installer
        run: npx electron-builder --publish never
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: memoria-${{ matrix.os }}
          path: |
            dist-installer/*.exe
            dist-installer/*.AppImage
            dist-installer/*.deb
            dist-installer/*.dmg
            dist-installer/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compose release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          prev=$(git tag --sort=-version:refname | awk -v cur="${GITHUB_REF_NAME}" '$0 != cur { print; exit }')
          section=$(awk -v ver="${version}" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md)
          # Body rilis = section CHANGELOG (kurasi) + riwayat commit per-tag
          # (format "- subject (sha)") — keduanya selalu tampil.
          {
            printf '## Memoria %s\n\n' "${GITHUB_REF_NAME}"
            if [ -n "${section}" ]; then printf '%s\n' "${section}"; fi
            printf '\n### Changes since %s\n\n' "${prev:-the beginning}"
            if [ -z "${prev}" ]; then
              git log --pretty=format:"- %s (%h)" --no-merges "${GITHUB_REF_NAME}" --max-count=100
            else
              git log --pretty=format:"- %s (%h)" --no-merges "${prev}..${GITHUB_REF_NAME}"
            fi
            echo
          } > release-body.md
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Memoria ${{ github.ref_name }}
          body_path: release-body.md
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: false
